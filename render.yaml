services:
  - type: web
    name: go-markdown
    runtime: static
    buildCommand: |
      rm -rf src/content
      git clone https://github.com/danilo1992-sys/obsidian.git src/content
      cd src/content
      for f in *.md; do
        case "$f" in
          *"¿"*|*"?"*) mv "$f" "$(echo "$f" | sed 's/[¿?]//g; s/  */ /g; s/^ //; s/ $//')" ;;
        esac
      done
      sed -i '/^id:/d;/^aliases:/d;/^  - /d;/^tags:/d' "Modulo Time.md"
      cd ../..
      npm install -g pnpm
      pnpm install --frozen-lockfile
      pnpm build
    staticPublishPath: dist
